name: GUI DMG

# Builds the Tauri desktop GUI as an Apple Silicon .dmg.
# macos-latest runners are arm64, so this is a fast native build.
# To also ship Intel, build with `--target universal-apple-darwin`
# (and `rustup target add x86_64-apple-darwin`); it roughly doubles
# compile time and binary size.
# Run from the Actions tab (or `gh workflow run gui-dmg.yml`) and
# download the artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - 'GUI-V*'

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build Apple Silicon DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/src-tauri/target
          key: gui-cargo-${{ runner.os }}-${{ hashFiles('gui/src-tauri/Cargo.toml') }}

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build app and DMG
        working-directory: gui
        run: npm run tauri build

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp gui/src-tauri/target/release/bundle/dmg/*.dmg out/
          shasum -a 256 out/*.dmg > out/SHA256SUMS
          ls -la out

      - name: Upload DMG
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: mole-gui-dmg
          path: out/
          if-no-files-found: error
